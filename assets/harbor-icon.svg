<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B3A"/><stop offset="0.62" stop-color="#123E6B"/><stop offset="1" stop-color="#0E6E7E"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD27A" stop-opacity="0.55"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/><stop offset="1" stop-color="#D9D2C3"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <!-- beacon light sweeping right -->
    <path d="M664 300 L924 220 L924 400 Z" fill="url(#beam)"/>
    <circle cx="664" cy="300" r="34" fill="#FFD27A"/>
    <circle cx="664" cy="300" r="70" fill="#FFD27A" opacity="0.18"/>
    <!-- the H: two pier pilings and a dock -->
    <rect x="318" y="290" width="92" height="420" rx="46" fill="url(#post)"/>
    <rect x="614" y="390" width="92" height="320" rx="46" fill="url(#post)"/>
    <rect x="318" y="486" width="388" height="78" rx="39" fill="url(#post)"/>
    <!-- water -->
    <path d="M100 690 C180 650 260 650 340 690 S500 730 580 690 S740 650 820 690 S900 720 924 705 V924 H100 Z" fill="#0A5866"/>
    <path d="M100 760 C180 720 260 720 340 760 S500 800 580 760 S740 720 820 760 S900 790 924 775 V924 H100 Z" fill="#08414F"/>
    <path d="M150 718 C210 692 270 692 330 718" stroke="#7FE0E6" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M560 788 C620 762 680 762 740 788" stroke="#7FE0E6" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
