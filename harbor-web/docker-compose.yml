version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: repobar-postgres
    environment:
      POSTGRES_USER: repobar
      POSTGRES_PASSWORD: repobar_dev_password
      POSTGRES_DB: repobar
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repobar']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repobar-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repobar-web
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://repobar:repobar_dev_password@postgres:5432/repobar
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
