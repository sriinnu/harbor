name: Web Deploy (Vercel)

on:
  push:
    branches: [main, develop]
    paths:
      - 'harbor-web/**'
      - '.github/workflows/web-deploy.yml'
  # PR trigger disabled until harbor-web has lock file + scripts wired up
  workflow_dispatch:

defaults:
  run:
    working-directory: harbor-web

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  lint:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: harbor-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Check formatting
        run: npm run format:check

  test:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: harbor-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/repobar_test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./harbor-web/coverage/lcov.info
          flags: web
          name: web-coverage

  build:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: Build Next.js App
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: harbor-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Check bundle size
        run: |
          npm run analyze
          # Fail if bundle is too large
          BUNDLE_SIZE=$(du -sb .next | cut -f1)
          MAX_SIZE=$((50 * 1024 * 1024))  # 50MB
          if [ $BUNDLE_SIZE -gt $MAX_SIZE ]; then
            echo "Bundle size $BUNDLE_SIZE exceeds maximum $MAX_SIZE"
            exit 1
          fi

  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: build
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.event_name == 'pull_request') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: harbor-web
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    needs: build
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main') }}
    environment:
      name: production
      url: https://repobar.app

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: harbor-web
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify deployment
        run: |
          curl --fail https://repobar.app/api/health || exit 1

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy-preview
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.event_name == 'pull_request') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: harbor-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.deploy-preview.outputs.preview-url }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: harbor-web/playwright-report/
          retention-days: 30
