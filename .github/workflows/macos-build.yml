name: macOS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  test:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: Run Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26.1 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1'

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --quiet --config .swiftlint.yml Sources

      - name: Build
        run: swift build --configuration release --product Harbor

      - name: Test
        run: swift test

# Releases are built, signed and notarized locally by Scripts/release.sh
# (docs/release.md); CI holds no signing or notary secrets.
