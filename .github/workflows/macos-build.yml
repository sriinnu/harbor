name: macOS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  test:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: Run Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26.1 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1'

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --quiet --config .swiftlint.yml Sources

      - name: Build
        run: swift build --configuration release --product Harbor

      # TODO: re-enable `swift test` once pre-existing test compile errors are
      # fixed (Swift 6 actor isolation in AzureDevOpsPATStore tests; WIQL DSL
      # tests use SQL-style = / <> operators that don't exist in Swift).

  build-app:
    name: Build macOS App
    runs-on: macos-latest
    needs: test
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26.1 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1'

      - name: Setup Node.js (for build scripts)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm run build:mac
        env:
          CONFIGURATION: Release

      - name: Create DMG
        run: pnpm run package:mac

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RepoBar-macOS
          path: dist/*.dmg
          retention-days: 30

  notarize:
    environment: release
    name: Notarize macOS App
    runs-on: macos-latest
    needs: build-app
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: RepoBar-macOS

      - name: Import code signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Clean up
          rm certificate.p12

      - name: Code sign
        run: |
          codesign --force --deep --sign "Developer ID Application" \
            --options runtime \
            --entitlements RepoBar.entitlements \
            --timestamp \
            RepoBar.app

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create ZIP for notarization
          ditto -c -k --keepParent RepoBar.app RepoBar.zip

          # Submit for notarization
          xcrun notarytool submit RepoBar.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          # Staple the ticket
          xcrun stapler staple RepoBar.app

      - name: Create final DMG
        run: pnpm run package:mac

      - name: Upload notarized app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RepoBar-macOS-Notarized
          path: dist/*.dmg
          retention-days: 90
