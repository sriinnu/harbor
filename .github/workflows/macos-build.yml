name: macOS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  SWIFT_VERSION: '6.0'

jobs:
  test:
    name: Run Tests
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --quiet --config .swiftlint.yml Sources

      - name: Build
        run: swift build --configuration release

      - name: Run tests
        run: swift test --parallel --enable-code-coverage

      - name: Generate code coverage
        run: |
          xcrun llvm-cov export -format="lcov" \
            .build/debug/HarborPackageTests.xctest/Contents/MacOS/HarborPackageTests \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov || true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov
          flags: macos
          name: macos-coverage
        continue-on-error: true

  build-app:
    name: Build macOS App
    runs-on: macos-14
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Setup Node.js (for build scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm run build:mac
        env:
          CONFIGURATION: Release

      - name: Create DMG
        run: pnpm run package:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoBar-macOS
          path: dist/*.dmg
          retention-days: 30

  notarize:
    name: Notarize macOS App
    runs-on: macos-14
    needs: build-app
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: RepoBar-macOS

      - name: Import code signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Clean up
          rm certificate.p12

      - name: Code sign
        run: |
          codesign --force --deep --sign "Developer ID Application" \
            --options runtime \
            --entitlements RepoBar.entitlements \
            --timestamp \
            RepoBar.app

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create ZIP for notarization
          ditto -c -k --keepParent RepoBar.app RepoBar.zip

          # Submit for notarization
          xcrun notarytool submit RepoBar.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          # Staple the ticket
          xcrun stapler staple RepoBar.app

      - name: Create final DMG
        run: pnpm run package:mac

      - name: Upload notarized app
        uses: actions/upload-artifact@v4
        with:
          name: RepoBar-macOS-Notarized
          path: dist/*.dmg
          retention-days: 90
