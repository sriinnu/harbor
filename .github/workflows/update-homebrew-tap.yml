name: Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., 0.1.0-alpha)'
        required: true
      sha256:
        description: 'SHA256 checksum of the DMG file'
        required: true

jobs:
  update-tap:
    runs-on: macos-latest

    steps:
      - name: Get version and SHA256
        id: release-info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix

            # Download the DMG and calculate SHA256
            DMG_URL="https://github.com/sriinnu/harbor/releases/download/v${VERSION}/Harbor-${VERSION}.dmg"
            echo "Downloading from: $DMG_URL"
            curl -sL "$DMG_URL" -o harbor.dmg
            SHA256=$(shasum -a 256 harbor.dmg | awk '{print $1}')

            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          else
            # Manual workflow dispatch
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "sha256=${{ github.event.inputs.sha256 }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: sriinnu/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update cask formula
        working-directory: homebrew-tap
        run: |
          VERSION="${{ steps.release-info.outputs.version }}"
          SHA256="${{ steps.release-info.outputs.sha256 }}"

          echo "Updating to version: $VERSION"
          echo "Using SHA256: $SHA256"

          # Update version line
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/harbor.rb

          # Update sha256 line - handle both :no_check and actual checksums
          if grep -q "sha256 :no_check" Casks/harbor.rb; then
            sed -i '' "s/sha256 :no_check.*/sha256 \"$SHA256\"/" Casks/harbor.rb
          else
            sed -i '' "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/harbor.rb
          fi

          # Show the changes
          echo "Updated cask formula:"
          cat Casks/harbor.rb

      - name: Commit and push changes
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Casks/harbor.rb
          git commit -m "Update Harbor to v${{ steps.release-info.outputs.version }}"
          git push

      - name: Create summary
        run: |
          echo "## Homebrew Tap Updated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.release-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`${{ steps.release-info.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can now install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "brew upgrade --cask harbor" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
