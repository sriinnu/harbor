name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  macos:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: macOS (Xcode 26.1)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1'

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          node -v || true
          pnpm -v || true

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # --ignore-scripts: skip postinstall build scripts (pnpm v11 elevates
        # ignored-builds to a fatal error; we don't need esbuild's native
        # binaries for the lint/test workflow)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Install SwiftLint, ShellCheck and cargo-audit
        run: |
          brew install swiftlint shellcheck
          cargo install cargo-audit --locked

      # The same gate as a local `pnpm verify`: strict build (warnings are errors),
      # SwiftLint --strict, tests (crashed or empty runners fail), dependency
      # vulnerabilities (pnpm audit, cargo audit), shellcheck.
      # swiftformat joins once the repo-wide formatting PR lands (board H-015).
      - name: Verify
        run: pnpm verify
