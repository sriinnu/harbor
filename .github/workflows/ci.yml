name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  macos:
    name: macOS (Xcode 26.1)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1'

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          node -v || true
          pnpm -v || true

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # --ignore-scripts: skip postinstall build scripts (pnpm v11 elevates
        # ignored-builds to a fatal error; we don't need esbuild's native
        # binaries for the lint/test workflow)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Install SwiftLint/SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Run checks
        run: pnpm check
