name: Windows Build & Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'harbor-windows/**'
      - '.github/workflows/windows-build.yml'
  # PR trigger disabled until harbor-windows has icons + working package metadata
  workflow_dispatch:

defaults:
  run:
    working-directory: harbor-windows

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  test:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: Run Rust Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            harbor-windows/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: harbor-windows/src-tauri

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: harbor-windows/src-tauri

      - name: Run tests
        run: cargo test --verbose
        working-directory: harbor-windows/src-tauri

  build:
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    environment: release
    name: Build Tauri App
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: harbor-windows/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Harbor-Windows-MSI
          path: harbor-windows/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Harbor-Windows-NSIS
          path: harbor-windows/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  sign:
    environment: release
    name: Sign Windows Installer
    runs-on: windows-latest
    needs: build
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main') }}

    steps:
      - name: Download MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Harbor-Windows-MSI

      - name: Install Azure SignTool
        run: dotnet tool install --global AzureSignTool

      - name: Sign installer
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
          AZURE_KEY_VAULT_CERTIFICATE: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE }}
        run: |
          AzureSignTool sign \
            -kvu "$env:AZURE_KEY_VAULT_URI" \
            -kvi "$env:AZURE_KEY_VAULT_CLIENT_ID" \
            -kvs "$env:AZURE_KEY_VAULT_CLIENT_SECRET" \
            -kvt "$env:AZURE_KEY_VAULT_TENANT_ID" \
            -kvc "$env:AZURE_KEY_VAULT_CERTIFICATE" \
            -tr http://timestamp.digicert.com \
            -td sha256 \
            *.msi

      - name: Upload signed installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Harbor-Windows-Signed
          path: '*.msi'
          retention-days: 90

  publish-winget:
    permissions:
      contents: write
    name: Publish to WinGet
    runs-on: windows-latest
    needs: sign
    # Hosted runners need paid minutes on a private repo: run only once it is public (or on manual dispatch).
    if: ${{ (!github.event.repository.private || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download signed installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Harbor-Windows-Signed

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create WinGet manifest
        run: |
          # TODO: Create winget manifest and submit PR to microsoft/winget-pkgs
          echo "WinGet manifest creation placeholder"

      - name: Upload to release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: '*.msi'
