<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-gradient)"/>

  <!-- Menu Bar Representation -->
  <g transform="translate(100, 80)">
    <!-- Menu bar window -->
    <rect x="0" y="0" width="600" height="240" rx="12" fill="#1a1a2e" opacity="0.95" filter="url(#shadow)"/>

    <!-- Header -->
    <text x="20" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">
      Harbor - Your Repositories
    </text>

    <!-- Repo Cards -->
    <g transform="translate(20, 60)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="170" height="140" rx="8" fill="#2d2d44" opacity="0.9"/>
      <circle cx="15" cy="15" r="8" fill="#4ade80"/>
      <text x="30" y="20" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="500">harbor</text>
      <text x="15" y="45" fill="#9ca3af" font-family="system-ui" font-size="10">CI: Passing ✓</text>
      <text x="15" y="65" fill="#9ca3af" font-family="system-ui" font-size="10">Latest: v0.1.0</text>
      <text x="15" y="85" fill="#9ca3af" font-family="system-ui" font-size="10">PRs: 3 open</text>
      <rect x="10" y="105" width="150" height="20" rx="4" fill="#667eea"/>
      <text x="50" y="119" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="500">View Details</text>

      <!-- Card 2 -->
      <rect x="195" y="0" width="170" height="140" rx="8" fill="#2d2d44" opacity="0.9"/>
      <circle cx="210" cy="15" r="8" fill="#fbbf24"/>
      <text x="225" y="20" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="500">api-server</text>
      <text x="210" y="45" fill="#9ca3af" font-family="system-ui" font-size="10">CI: Running ⟳</text>
      <text x="210" y="65" fill="#9ca3af" font-family="system-ui" font-size="10">Latest: v2.3.1</text>
      <text x="210" y="85" fill="#9ca3af" font-family="system-ui" font-size="10">Issues: 7</text>
      <rect x="205" y="105" width="150" height="20" rx="4" fill="#667eea"/>
      <text x="245" y="119" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="500">View Details</text>

      <!-- Card 3 -->
      <rect x="390" y="0" width="170" height="140" rx="8" fill="#2d2d44" opacity="0.9"/>
      <circle cx="405" cy="15" r="8" fill="#ef4444"/>
      <text x="420" y="20" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="500">frontend</text>
      <text x="405" y="45" fill="#9ca3af" font-family="system-ui" font-size="10">CI: Failed ✗</text>
      <text x="405" y="65" fill="#9ca3af" font-family="system-ui" font-size="10">Latest: v1.0.2</text>
      <text x="405" y="85" fill="#9ca3af" font-family="system-ui" font-size="10">Commits: 42</text>
      <rect x="400" y="105" width="150" height="20" rx="4" fill="#667eea"/>
      <text x="440" y="119" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="500">View Details</text>
    </g>
  </g>

  <!-- Bottom text -->
  <text x="400" y="360" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" opacity="0.9">
    Your GitHub work, safely docked in the menu bar ⚓
  </text>
</svg>
