[package]
name = "harbor-linux"
version = "0.5.0"
description = "Harbor Linux - GitHub menubar app"
authors = ["Sriinnu"]
edition = "2021"

[dependencies]
# Tauri dependencies
tauri = { version = "2.0.0", features = ["shell-open"] }
tauri-build = { version = "2.0.0", features = [] }

# Platform utilities
secret-service = "0.21"
dirs = "5.0"
once_cell = "1.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = "2.0.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
