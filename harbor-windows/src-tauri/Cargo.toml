[package]
name = "repobar"
version = "0.2.0"
description = "GitHub repository manager for Windows system tray"
authors = ["RepoBar Team"]
license = "MIT"
repository = "https://github.com/steipete/repobar"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
# Tokens go to Windows Credential Manager. keyring 3.x has NO default backend and
# silently falls back to an in-memory mock: on upgrade, enable "windows-native".
keyring = "2.3"
tiny_http = "0.12"
url = "2.5"
sha2 = "0.10"
base64 = "0.21"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }
